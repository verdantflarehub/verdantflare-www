<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VerdantFlare 面向创作者、团队和开发者，连接模型、应用与项目，持续完善创作资产的版本、来源追溯与跨项目复用。了解当前能力、接入条件与 Hub 使用入口。"
    />
    <meta name="theme-color" content="#0b0f0c" />
    <script>
      (() => {
        let selected;
        try { selected = localStorage.getItem("verdantflare_theme"); } catch { /* storage may be unavailable */ }
        const theme = selected === "light" || selected === "dark"
          ? selected
          : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#eef2ef" : "#0b0f0c";
      })();
    </script>
    <link rel="icon" type="image/png" href="/brand/verdantflare-logo.png" />
    <title>VerdantFlare | 让创作持续积累</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
