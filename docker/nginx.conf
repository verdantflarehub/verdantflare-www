server {
  listen 8087;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /api/auth/session {
    proxy_pass http://verdantflare-login-api.verdantflare.svc.cluster.local:8088/api/auth/session;
    proxy_set_header Cookie $http_cookie;
    add_header Cache-Control "no-store" always;
  }

  location /api/control/public/ {
    proxy_pass http://verdantflare-service-control.verdantflare.svc.cluster.local:8080/api/control/public/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    # Fetch the SPA shell afresh after a release; fingerprinted assets stay immutable.
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
